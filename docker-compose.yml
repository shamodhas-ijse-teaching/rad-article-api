name: rad-article-api

services:
  mongodb:
    image: mongo:7.0
    container_name: rad-article
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: 1234
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data: